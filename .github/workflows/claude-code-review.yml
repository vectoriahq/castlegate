name: Claude Code Review

# Code review of every pull request by Anthropic's /code-review plugin, adapted
# from vectoriahq/groundwork's workflow of the same name, whose header records
# the failures each protection here answers. In short:
#
# - The Claude Code build and the main model are pinned, because a newer build
#   on another default model read diffs itself and launched none of the
#   plugin's agents. Every review here requires the agents: this repository is
#   a security component, so there is no single-pass mode.
# - The prompt asks for agents that finish inside the turn that started them,
#   because a headless run ends with the turn and never hears from a
#   background agent.
# - The prompt asks for a REVIEW-COMPLETE line, and the job fails when no
#   attempt produced it with at least four agents run, because the action
#   reports success whenever the model stops normally, reviewed or not.
# - A stopped attempt gets one retry.
# - "Already reviewed" is answered from the commit ids of claude[bot]'s
#   reviews, fetched before each attempt, never from review comments, whose
#   commit id GitHub moves to the head on every push.
#
# Needs the Claude GitHub App installed on this repository and the
# CLAUDE_CODE_OAUTH_TOKEN secret.

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

concurrency:
  group: claude-code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    env:
      CLAUDE_CODE_VERSION: 2.1.303
      DISABLE_AUTOUPDATER: '1'
      REVIEW_PROMPT: |
        /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

        This is a non-interactive run. Nothing will re-invoke you once you
        stop, so treat ending your turn as ending the review. Do not end your
        turn while any work is outstanding. Launch each agent to run to
        completion and return its result within the turn that started it, and
        read that result before moving on.

        Run the plugin's procedure as it is written: launch its review agents
        and its validation agents with the Agent tool. Do not read the diff
        yourself in their place. This run is graded on its transcript: an
        attempt in which fewer than four agents ran is reported as unfinished
        and retried, whatever its final message says.

        The eligibility check stops when Claude has already reviewed the pull
        request. Read that as covering commit
        ${{ github.event.pull_request.head.sha }} only, and answer it from
        this file and nothing else:

            ${{ github.workspace }}/.review-context/reviewed-commits.txt

        It holds the commit id of every review claude[bot] has submitted on
        this pull request, one per line. Only an exact match against the head
        commit means it has been reviewed. Read
        ${{ github.workspace }}/.review-context/review-comments.jsonl to avoid
        posting a finding that is already there.

        When you have finished, end your final message with the single line
        REVIEW-COMPLETE on its own, whether or not you posted anything.
      REVIEW_CLAUDE_ARGS: |
        --setting-sources user
        --model claude-opus-5-5
        --append-system-prompt "Castlegate is a QGIS Server plugin that decides per person which layers, features and fields a signed-in person may see and edit. It fails closed: no valid token, an unreadable rules table, an exception anywhere in the plugin, or a service the plugin does not cover each get nothing, and an exception escaping a QGIS Server filter method kills the server process. Code under core/ must import only Python's standard library. Review the diff for code defects, especially anything that grants more than the rules allow, accepts a token it should refuse, or lets an exception escape. One check on prose: whether each code comment the diff adds or changes is true of the code it sits in. Raise nothing else about prose. Do not speculate about why a change was made."
        --allowedTools "Skill,Task,Agent,Read,Grep,Glob,TodoWrite,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(git ls-files:*),Bash(git rev-parse:*)"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Write the helper scripts
        run: |
          cat > "${RUNNER_TEMP}/collect-earlier-reviews.sh" <<'COLLECT'
          #!/usr/bin/env bash
          set -uo pipefail
          dir="${GITHUB_WORKSPACE}/.review-context"
          mkdir -p "${dir}"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --jq '.[] | select(.user.login == "claude[bot]") | .commit_id' > "${dir}/reviewed-commits.txt" \
            || : > "${dir}/reviewed-commits.txt"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments" \
            --jq '.[] | {user: .user.login, path, line, original_commit_id, body}' > "${dir}/review-comments.jsonl" \
            || : > "${dir}/review-comments.jsonl"
          COLLECT

          cat > "${RUNNER_TEMP}/install-claude.sh" <<'INSTALL'
          #!/usr/bin/env bash
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s "${CLAUDE_CODE_VERSION}"
          installed=$("${HOME}/.local/bin/claude" --version)
          case "${installed}" in
            "${CLAUDE_CODE_VERSION} "*) ;;
            *) echo "::error::Wanted Claude Code ${CLAUDE_CODE_VERSION}, found: ${installed}"; exit 1 ;;
          esac
          echo "path=${HOME}/.local/bin/claude" >> "$GITHUB_OUTPUT"
          INSTALL

          cat > "${RUNNER_TEMP}/grade.sh" <<'GRADE'
          #!/usr/bin/env bash
          # Usage: grade.sh <attempt> <execution-file>
          set -uo pipefail
          attempt="$1"
          saved="${RUNNER_TEMP}/claude-execution-attempt-${attempt}.json"
          message=""
          agents=0
          if [ -n "${2:-}" ] && [ -f "$2" ]; then
            cp "$2" "${saved}"
            message=$(jq -r '[.[] | select(.type == "result")] | last | .result // ""' "${saved}" || true)
            agents=$(jq '[.[] | .parent_tool_use_id | select(. != null)] | unique | length' "${saved}" 2>/dev/null || echo 0)
          fi
          if printf '%s' "${message}" | grep -q 'REVIEW-COMPLETE' && [ "${agents}" -ge 4 ]; then
            completed=true
          else
            completed=false
          fi
          echo "completed=${completed}" >> "$GITHUB_OUTPUT"
          echo "Attempt ${attempt}: completed=${completed}, ${agents} agents." >> "$GITHUB_STEP_SUMMARY"
          GRADE

          chmod +x "${RUNNER_TEMP}"/*.sh

      - name: Fetch earlier reviews
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ${{ runner.temp }}/collect-earlier-reviews.sh

      - name: Install Claude Code
        id: build_1
        run: ${{ runner.temp }}/install-claude.sh

      - name: Review
        id: review_1
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ steps.build_1.outputs.path }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: ${{ env.REVIEW_PROMPT }}
          show_full_output: true
          claude_args: ${{ env.REVIEW_CLAUDE_ARGS }}

      - name: Grade the first attempt
        id: grade_1
        if: ${{ !cancelled() && steps.review_1.outcome == 'success' }}
        run: ${{ runner.temp }}/grade.sh 1 "${{ steps.review_1.outputs.execution_file }}"

      - name: Fetch earlier reviews again
        if: ${{ !cancelled() && steps.review_1.outcome == 'success' && steps.grade_1.outputs.completed != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ${{ runner.temp }}/collect-earlier-reviews.sh

      - name: Install Claude Code again
        id: build_2
        if: ${{ !cancelled() && steps.review_1.outcome == 'success' && steps.grade_1.outputs.completed != 'true' }}
        run: ${{ runner.temp }}/install-claude.sh

      - name: Retry the review
        id: review_2
        if: ${{ !cancelled() && steps.review_1.outcome == 'success' && steps.grade_1.outputs.completed != 'true' }}
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ steps.build_2.outputs.path }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: ${{ env.REVIEW_PROMPT }}
          show_full_output: true
          claude_args: ${{ env.REVIEW_CLAUDE_ARGS }}

      - name: Grade the second attempt
        id: grade_2
        if: ${{ !cancelled() && steps.review_2.outcome == 'success' }}
        run: ${{ runner.temp }}/grade.sh 2 "${{ steps.review_2.outputs.execution_file }}"

      - name: Upload the review transcripts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-execution-output
          path: ${{ runner.temp }}/claude-execution-attempt-*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify the review ran to completion
        if: ${{ !cancelled() }}
        env:
          DONE_1: ${{ steps.grade_1.outputs.completed }}
          DONE_2: ${{ steps.grade_2.outputs.completed }}
        run: |
          if [ "${DONE_1}" = "true" ] || [ "${DONE_2}" = "true" ]; then
            exit 0
          fi
          echo "The reviewer did not finish on any attempt, so this commit has NOT been reviewed." >> "$GITHUB_STEP_SUMMARY"
          exit 1

# The browser's preflight request and the cross-origin headers for Groundwork's origin, in the
# server block of the qgis/qgis-server image's nginx (it includes /etc/nginx/qgis.d/*.conf there).
# To allow another origin, change it on the first if line.
set $castlegate_origin "";
if ($http_origin = "https://app.groundwork.do") {
    set $castlegate_origin $http_origin;
}
# An empty value sends no header, so another origin gets none of the Access-Control headers.
# Vary goes on every response, because the answer depends on the Origin header.
add_header Access-Control-Allow-Origin $castlegate_origin always;
add_header Vary Origin always;
set $castlegate_cors_headers "";
set $castlegate_cors_methods "";
set $castlegate_cors_expose "";
set $castlegate_cors_max_age "";
if ($castlegate_origin) {
    set $castlegate_cors_headers "Authorization, Content-Type";
    set $castlegate_cors_methods "GET, POST, OPTIONS";
    set $castlegate_cors_expose "WWW-Authenticate";
    set $castlegate_cors_max_age "600";
}
add_header Access-Control-Allow-Headers $castlegate_cors_headers always;
add_header Access-Control-Allow-Methods $castlegate_cors_methods always;
add_header Access-Control-Expose-Headers $castlegate_cors_expose always;
add_header Access-Control-Max-Age $castlegate_cors_max_age always;
# QGIS Server does not answer OPTIONS: nginx answers the allowed origin's preflight, and refuses the rest.
set $castlegate_preflight "$request_method:$castlegate_origin";
if ($castlegate_preflight = "OPTIONS:") {
    return 403;
}
if ($request_method = OPTIONS) {
    return 204;
}
